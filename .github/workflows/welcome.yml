name: Welcome New Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 **Welcome to Venus!** Thanks for opening your first issue.
            
            A maintainer will respond soon. In the meantime:
            - 📖 Check our [Contributing Guide](https://github.com/alvezgr/venus/blob/master/CONTRIBUTING.md)
            - 💬 Join [Discussions](https://github.com/alvezgr/venus/discussions) for Q&A
            - 🐛 Browse [good first issues](https://github.com/alvezgr/venus/issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22)
            
            We're excited to have you here! 🚀
            
          pr-message: |
            🎉 **Thanks for your first Pull Request!**
            
            Please ensure:
            - [ ] All tests pass (`cargo test`)
            - [ ] Code is formatted (`cargo fmt`)
            - [ ] No clippy warnings (`cargo clippy`)
            - [ ] PR description links to an issue (e.g., "Fixes #123")
            - [ ] All acceptance criteria from the linked issue are met
            
            Thanks for contributing to Venus! 💜
