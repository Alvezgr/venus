[package]
name = "venus"
version = "0.3.1"
edition = "2021"
description = "A native Rust API client for Insomnia users, with cloud collection and environment sync"
authors = ["Alvezgr", "Harshit Chaudhary <harrykumar.kp@gmail.com>"]
license = "MIT"
repository = "https://github.com/alvezgr/venus"
homepage = "https://github.com/alvezgr/venus"
keywords = ["api", "rest", "http", "client", "developer-tools"]
categories = ["development-tools", "network-programming"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
reqwest = { version = "0.13", features = ["json", "blocking", "cookies", "gzip", "brotli", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dirs = "6"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
notify-debouncer-mini = "0.7"
base64 = "0.22.1"
openssl = "0.10"
flate2 = "1"
time = { version = "0.3", features = ["formatting"] }
crypto_box = { version = "0.9", features = ["seal"] }

[dev-dependencies]
tempfile = "3"
egui_kittest = "0.33"

# Release optimizations
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Bundle configuration for cargo-bundle
[package.metadata.bundle]
name = "Venus"
identifier = "io.github.alvezgr.venus"
icon = ["assets/icons/icon.icns"]
category = "Developer Tool"
short_description = "A native API client for Insomnia users"
long_description = """
Venus lets Insomnia users work with their cloud collections without running Insomnia.
Built in Rust, with browser sign-in, request and environment sync, and commit previews.
"""
copyright = "Copyright (c) 2024 Harshit Chaudhary. MIT License."

# cargo-bundle 0.10 moved the macOS keys into their own table and rejects
# unknown fields, so the old flat `osx_minimum_system_version` fails the build.
[package.metadata.bundle.osx]
minimum_system_version = "12.0"
